<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lupa - Latijn avontuur</title><style>
:root{--navy:#14213d;--blue:#246bfe;--green:#48d66b;--yellow:#ffd93d;--orange:#ff9f1c;--red:#ff4d6d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--navy);background:#bcecff}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}#app{height:100dvh;overflow:hidden}.top{height:56px;background:#fff;border-bottom:4px solid var(--navy);display:flex;align-items:center;padding:0 14px;gap:14px}.logo{font-size:23px;font-weight:900;color:var(--blue)}.logo b{color:var(--orange)}#worldLabel{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.hud{margin-left:auto;display:flex;gap:13px;align-items:center;font-weight:900}.bar{width:110px;height:14px;border:3px solid var(--navy);border-radius:10px;overflow:hidden;background:#e7eef5}.bar i{display:block;height:100%;background:var(--green);width:0}.screen{display:none;height:calc(100dvh - 56px);overflow:hidden}.screen.active{display:block}.intro.active,.done.active{display:grid}.intro{grid-template-columns:1fr 1fr;background:linear-gradient(135deg,#effcff 0 52%,#67c9ff 52%)}.copy{padding:6vw;display:flex;justify-content:center;flex-direction:column}.copy small,.eyebrow{font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.12em}.copy h1,.done h1{font-size:clamp(50px,8vw,100px);line-height:.88;letter-spacing:-.07em;margin:14px 0}.copy p,.done p{font-size:19px;line-height:1.45;max-width:620px}.hero{position:relative;background:linear-gradient(#55c5ff 0 55%,#3189ce 56%)}.sun{position:absolute;width:130px;height:130px;border-radius:50%;background:var(--yellow);right:12%;top:10%}.hill{position:absolute;inset:auto 0 0;height:60%;background:#46705a;clip-path:polygon(0 50%,18% 16%,37% 52%,57% 5%,78% 48%,100% 18%,100% 100%,0 100%)}.btn{border:3px solid var(--navy);border-radius:13px;min-height:48px;padding:0 22px;background:var(--green);font-weight:900;box-shadow:0 6px 0 var(--navy);cursor:pointer}.game{padding:8px}.layout{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:8px}.stage{position:relative;border:4px solid var(--navy);border-radius:17px;overflow:hidden;background:#bde8ff}.stage canvas{display:block;width:100%;height:100%}.side{border:4px solid var(--navy);border-radius:17px;background:#fff;padding:14px;overflow:hidden;display:flex;flex-direction:column;gap:10px}.side h2{margin:0;font-size:25px;line-height:1}.mission{background:#fff3d7;border-left:6px solid var(--orange);padding:9px}.words{display:grid;gap:4px}.word{font-size:12px;padding:5px 7px;border-radius:7px;background:#eef8ff;display:flex;justify-content:space-between}.word.lock{color:#9aa8b7;background:#f2f4f6}.word b{color:#175ad5}.touch{display:none;position:absolute;bottom:12px;left:12px;right:12px;justify-content:space-between;pointer-events:none}.touch div{display:flex;gap:8px}.touch button{width:58px;height:58px;border:3px solid white;border-radius:15px;background:#14213ddd;color:#fff;font-size:24px;pointer-events:auto}.touch .jump{background:#ff9f1cee;color:var(--navy)}.overlay{position:fixed;inset:0;background:#14213dc9;display:grid;place-items:center;padding:14px;z-index:20}.hidden{display:none}.modal{width:min(600px,96vw);background:#fff;border:5px solid var(--navy);border-radius:22px;padding:28px;box-shadow:0 11px 0 var(--navy)}.modal h2{font-size:clamp(29px,5vw,44px);margin:9px 0}.modal p{line-height:1.4}.latin{font-family:Georgia,serif;font-size:21px;background:#eef8ff;padding:13px;border-left:6px solid var(--orange)}.inputrow{display:flex;gap:9px;margin-top:18px}.inputrow input{flex:1;min-width:0;border:3px solid var(--navy);border-radius:12px;padding:12px;font-weight:900}.answers{display:grid;gap:8px;margin-top:16px}.answer{border:3px solid var(--navy);border-radius:12px;min-height:48px;padding:9px 12px;text-align:left;font-weight:900;background:#eef8ff;box-shadow:0 4px 0 var(--navy);cursor:pointer}.feedback{min-height:23px;margin-top:12px;font-weight:900}.done{place-items:center;padding:20px;background:linear-gradient(135deg,#2b8cff,#65e0ff)}.card{width:min(850px,100%);background:#fff;border:5px solid var(--navy);border-radius:24px;padding:35px;box-shadow:0 11px 0 var(--navy)}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:3px solid #d5e2ec;margin:24px 0}.stats div{padding:14px}.stats b{display:block;font-size:36px;color:var(--blue)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:absolute;right:14px;top:70px;width:220px;height:auto;z-index:3}.touch{display:flex}}@media(max-width:600px){.top{height:50px}.screen{height:calc(100dvh - 50px)}#worldLabel,.bar{display:none}.intro{grid-template-columns:1fr}.hero{position:absolute;inset:50px 0 0;opacity:.25}.copy{z-index:2;padding:22px}.side{display:none}.game{padding:3px}.modal{padding:20px}.inputrow{flex-direction:column}.stats b{font-size:28px}}
</style></head><body><div id="app"><header class="top"><div class="logo">LUPA<b>&gt;</b></div><div id="worldLabel">Latijn avontuur</div><div class="hud"><span id="hearts">♥ ♥ ♥</span><span>XP <b id="xp">0</b></span><div class="bar"><i id="progress"></i></div></div></header><main>
<section id="intro" class="screen intro active"><div class="copy"><small>Vijf verschillende werelden</small><h1>Red de tweeling.</h1><p>Klim, zoek, ren, ontwijk en ontrafel het verhaal van Romulus en Remus. Elk goed getypt antwoord opent de volgende route.</p><p><button id="start" class="btn">Start het avontuur</button></p></div><div class="hero"><div class="sun"></div><div class="hill"></div></div></section>
<section id="game" class="screen game"><div class="layout"><div class="stage"><canvas id="canvas" width="1000" height="650"></canvas><div class="touch"><div><button id="left">◀</button><button id="right">▶</button></div><button id="jump" class="jump">▲</button></div></div><aside class="side"><div class="eyebrow">Huidige missie</div><h2 id="mission"></h2><div class="mission"><b id="step"></b><div id="instruction"></div></div><b>Geleerde woorden</b><div id="words" class="words"></div></aside></div></section>
<section id="done" class="screen done"><div class="card"><div class="eyebrow">Wereld voltooid</div><h1 id="doneTitle"></h1><p id="doneText"></p><div class="stats"><div><b id="score">0</b>XP</div><div><b id="known">0/6</b>woorden</div><div><b id="accuracy">0%</b>goed</div></div><button id="next" class="btn">Volgende wereld</button></div></section></main></div>
<div id="overlay" class="overlay hidden"><div class="modal"><div id="modalType" class="eyebrow"></div><h2 id="modalTitle"></h2><div id="modalText"></div><div id="answerArea"></div><div id="feedback" class="feedback"></div></div></div>
<script>(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d');
const worlds=[
{name:'De overstroomde stad',mission:'Spring over het stijgende water',mode:'water',pal:['#bce9ff','#f4deb7','#2674aa','#153d66'],v:[['subito','plotseling'],['infans','baby'],['haud','helemaal niet'],['nam','want'],['submergere','laten verdrinken'],['protegere','beschermen']],final:['Waarom denkt Faustulus dat de goden helpen?','Dei pueros protegunt, nam flumen eos non submergit.','De goden beschermen de jongens, want de rivier laat hen niet verdrinken.',['De herders bewaken de rivier, want de kinderen slapen.','De wolvin vlucht, omdat Faustulus naar huis gaat.']]},
{name:'Het wolvenbos',mission:'Vind het spoor door het bos',mode:'forest',pal:['#b8e5bd','#e7d8ad','#355f45','#173725'],v:[['pastor','herder'],['grex','kudde'],['custodire','bewaken'],['accedere','naderen'],['ubera','tepels'],['praebere','aanbieden']],final:['Wat gebeurt er bij de wolvin?','Lupa pueris ubera praebet. Sic pueri bibunt.','De wolvin biedt de jongens haar tepels aan. Zo drinken de jongens.',['De herder bewaakt de wolvin. Zo slapen de jongens.','De vrouw brengt de jongens naar de rivier.']]},
{name:'De missie van Faustulus',mission:'Ren over de daken naar huis',mode:'roofs',pal:['#ffd59b','#f3bb70','#8b5938','#4d2f22'],v:[['sic','zo'],['bibere','drinken'],['cogitare','nadenken'],['domum','naar huis'],['uxor','echtgenote'],['tradere','overhandigen']],final:['Wat doet Faustulus?','Faustulus pueros tollit et domum portat. Pueros uxori tradit.','Faustulus tilt de jongens op, brengt hen naar huis en geeft hen aan zijn echtgenote.',['Faustulus laat de jongens bij de rivier en roept de herder.','Faustulus brengt zijn echtgenote naar de kudde.']]},
{name:'De godenproef',mission:'Beklim de tempel',mode:'temple',pal:['#d8c8ff','#f4eaff','#604d9a','#28204f'],v:[['deus','god'],['nocere + dat.','kwaad doen aan'],['dicere','zeggen'],['favere + dat.','steun geven aan'],['filius','zoon'],['femina','vrouw']],final:['Wat zegt Faustulus tegen zijn echtgenote?','Mihi et tibi dei favent, nam filios nobis praebent.','De goden steunen mij en jou, want zij bieden ons zonen aan.',['De goden beschermen de rivier, want zij geven ons een kudde.','De jongens steunen de goden en brengen ons naar huis.']]},
{name:'De naam van de tweeling',mission:'Bereik de naamzaal',mode:'hall',pal:['#ffc7df','#fff0a8','#9b4269','#52213a'],v:[['ridere','lachen'],['nomen','naam'],['dare','geven'],['alter … alter','de een de ander'],['mater','moeder'],['pater','vader']],final:['Welke namen krijgen de jongens?','Femina ridet. Pueris nomina dat: alterum Romulum, alterum Remum vocat.','De vrouw lacht en geeft de jongens namen: de een noemt zij Romulus, de ander Remus.',['De moeder geeft Faustulus twee namen: Romulus en Remus.','De vrouw roept de jongens, maar geeft hen nog geen naam.']]}
];
const layouts=[
[{x:0,y:535,w:170,h:115},{x:225,y:490,w:130,h:25},{x:400,y:430,w:140,h:25},{x:590,y:495,w:120,h:25},{x:760,y:420,w:240,h:230}],
[{x:0,y:540,w:140,h:110},{x:170,y:465,w:110,h:25},{x:315,y:390,w:105,h:25},{x:455,y:470,w:110,h:25},{x:605,y:360,w:100,h:25},{x:750,y:450,w:250,h:200}],
[{x:0,y:520,w:150,h:130},{x:185,y:455,w:150,h:65},{x:375,y:395,w:135,h:125},{x:550,y:470,w:140,h:50},{x:730,y:350,w:120,h:170},{x:885,y:440,w:115,h:210}],
[{x:0,y:545,w:145,h:105},{x:180,y:485,w:105,h:25},{x:320,y:425,w:105,h:25},{x:460,y:365,w:105,h:25},{x:600,y:305,w:105,h:25},{x:740,y:365,w:105,h:25},{x:880,y:285,w:120,h:365}],
[{x:0,y:530,w:180,h:120},{x:220,y:530,w:100,h:120},{x:360,y:470,w:100,h:180},{x:500,y:410,w:100,h:240},{x:640,y:470,w:100,h:180},{x:780,y:530,w:220,h:120}]
];
const gateSets=[[145,330,515,690,815,940],[115,255,400,545,685,920],[125,310,490,670,820,950],[120,270,420,570,720,930],[155,300,440,580,720,930]];
let wi=0,vocab=worlds[0].v,platforms=layouts[0],gates=gateSets[0];const S={xp:0,h:3,g:0,known:new Set(),tries:0,ok:0,run:false,pause:false};const P={x:42,y:470,w:34,h:50,vx:0,vy:0,on:false,sx:42,sy:470};const K={l:false,r:false,j:false};
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function norm(s){return s.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[().,;:]/g,'').replace(/\s+/g,' ')}
function reset(){vocab=worlds[wi].v;platforms=layouts[wi];gates=gateSets[wi];Object.assign(S,{xp:0,h:3,g:0,tries:0,ok:0,run:true,pause:false});S.known.clear();Object.assign(P,{x:42,y:470,vx:0,vy:0,sx:42,sy:470});$('#worldLabel').textContent=`Wereld ${wi+1}/5 · ${worlds[wi].name}`;$('#mission').textContent=worlds[wi].mission;update();}
function update(){if(!S.run)return;$('#xp').textContent=S.xp;$('#hearts').textContent='♥ '.repeat(S.h).trim();$('#progress').style.width=(S.g/6*100)+'%';$('#step').textContent=`Checkpoint ${Math.min(S.g+1,6)} van 6`;$('#instruction').textContent=['Spring van eiland naar eiland.','# Zoek de route tussen de bomen.','Gebruik de daken als snelle route.','Klim steeds hoger naar de tempel.','Vind de juiste weg door de naamzaal.'][wi].replace('# ','');$('#words').innerHTML=vocab.map((v,i)=>`<div class="word ${S.known.has(i)?'':'lock'}"><span>${S.known.has(i)?v[0]:'???'}</span><b>${S.known.has(i)?v[1]:'gesloten'}</b></div>`).join('')}
function start(){reset();screen('#game');requestAnimationFrame(loop)}function modal(type,title,text,area){S.pause=true;$('#modalType').textContent=type;$('#modalTitle').textContent=title;$('#modalText').innerHTML=text;$('#answerArea').innerHTML=area;$('#feedback').textContent='';$('#overlay').classList.remove('hidden')}function close(){S.pause=false;$('#overlay').classList.add('hidden')}
function ask(i){let v=vocab[i];modal('Woordpoort',`Wat betekent “${v[0]}”?`,'Typ de Nederlandse betekenis.','<form class="inputrow" id="wordForm"><input id="typed" autocomplete="off" autocapitalize="off" aria-label="Jouw antwoord"><button class="btn">Controleer</button></form>');$('#typed').focus();$('#wordForm').onsubmit=e=>{e.preventDefault();checkTyped(i)}}
function checkTyped(i){const input=$('#typed'),got=norm(input.value),want=norm(vocab[i][1]);if(!got){$('#feedback').textContent='Typ eerst een antwoord.';return}S.tries++;if(got===want){S.ok++;S.xp+=100;S.known.add(i);$('#feedback').textContent='+100 XP · poort geopend';input.disabled=true;setTimeout(()=>{close();S.g++;P.sx=Math.min(850,gates[i]+35);P.sy=350;update()},650)}else{S.h=Math.max(0,S.h-1);$('#feedback').textContent='Nog niet. Probeer het opnieuw.';input.value='';input.focus();if(S.h===0){S.h=3;P.x=P.sx;P.y=P.sy}update()}}
function final(){const f=worlds[wi].final;const options=shuffle([[f[2],true],...[f[3][0],f[3][1]].map(x=>[x,false])]);modal('Verhaalchallenge',f[0],`<div class="latin">${f[1]}</div>`,`<div class="answers">${options.map((o,i)=>`<button class="answer" data-i="${i}">${String.fromCharCode(65+i)}. ${o[0]}</button>`).join('')}</div>`);document.querySelectorAll('.answer').forEach((b,i)=>b.onclick=()=>{S.tries++;if(options[i][1]){S.ok++;S.xp+=250;b.style.background='#c9ffd2';setTimeout(finish,700)}else{S.h=Math.max(1,S.h-1);b.style.background='#ffd7df';$('#feedback').textContent='Niet juist. Lees de Latijnse zin nog een keer.';update()}})}
function finish(){close();S.run=false;let last=wi===4;$('#doneTitle').textContent=last?'Romulus en Remus zijn veilig!':`${worlds[wi].name} voltooid`;$('#doneText').textContent=last?'Je hebt alle vijf werelden uitgespeeld.':'De volgende wereld heeft een nieuwe route, opdracht en omgeving.';$('#score').textContent=S.xp;$('#known').textContent=`${S.known.size}/6`;$('#accuracy').textContent=Math.round(S.ok/Math.max(1,S.tries)*100)+'%';$('#next').textContent=last?'Speel opnieuw':'Volgende wereld';screen('#done')}
function physics(){if(S.pause)return;P.vx=(K.r?4.3:0)-(K.l?4.3:0);if(K.j&&P.on){P.vy=-12;P.on=false}K.j=false;P.vy+=.62;P.x+=P.vx;P.y+=P.vy;P.x=Math.max(0,Math.min(966,P.x));P.on=false;for(const r of platforms)if(P.x+P.w>r.x&&P.x<r.x+r.w&&P.y+P.h>=r.y&&P.y+P.h<=r.y+22&&P.vy>=0){P.y=r.y-P.h;P.vy=0;P.on=true}if(P.y>620){P.x=P.sx;P.y=P.sy;P.vy=0}let gx=gates[S.g];if(gx&&P.x+P.w>gx-5){P.x=gx-P.w-7;ask(S.g)}if(S.g===6&&P.x>900)final()}
function draw(){const w=worlds[wi],p=w.pal;let gr=ctx.createLinearGradient(0,0,0,650);p.forEach((c,i)=>gr.addColorStop(i/3,c));ctx.fillStyle=gr;ctx.fillRect(0,0,1000,650);if(w.mode==='forest'){ctx.fillStyle='#244b34';for(let x=20;x<1000;x+=95){ctx.fillRect(x,220,18,310);ctx.beginPath();ctx.arc(x+9,205,55,0,7);ctx.fill()}}else if(w.mode==='roofs'){ctx.fillStyle='#6f4934';for(let x=0;x<1000;x+=140){ctx.fillRect(x,320+(x%280?35:0),110,220);ctx.fillStyle='#b64f3c';ctx.beginPath();ctx.moveTo(x-10,330);ctx.lineTo(x+55,270);ctx.lineTo(x+120,330);ctx.fill();ctx.fillStyle='#6f4934'}}else if(w.mode==='temple'){ctx.fillStyle='#d8ceee';for(let x=90;x<950;x+=180){ctx.fillRect(x,170,34,380);ctx.fillRect(x-18,155,70,20)}ctx.fillRect(0,520,1000,50)}else if(w.mode==='hall'){ctx.fillStyle='#723451';for(let x=0;x<1000;x+=170){ctx.fillRect(x+50,180,80,350);ctx.beginPath();ctx.arc(x+90,180,40,Math.PI,0);ctx.fill()}}else{ctx.fillStyle='#6e7895';for(let x=0;x<1000;x+=145)ctx.fillRect(x,300-(x%290?40:0),75,220)}
ctx.fillStyle=wi===1?'#5b3c25':wi===2?'#8b5938':wi===3?'#ddd2ef':wi===4?'#d8a96b':'#7e6760';platforms.forEach(r=>{ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillStyle=p[1];ctx.fillRect(r.x,r.y,r.w,8);ctx.fillStyle=wi===1?'#5b3c25':wi===2?'#8b5938':wi===3?'#ddd2ef':wi===4?'#d8a96b':'#7e6760'});gates.forEach((x,i)=>{if(i<S.g)return;ctx.fillStyle=i===S.g?'#ffd93d':'#46516b';ctx.fillRect(x-6,300,12,235);ctx.fillRect(x-25,300,50,12)});ctx.fillStyle='#14213d';ctx.fillRect(P.x+4,P.y,26,18);ctx.fillStyle='#f1b891';ctx.fillRect(P.x+7,P.y+12,20,16);ctx.fillStyle='#ff9f1c';ctx.fillRect(P.x+2,P.y+28,30,23);ctx.fillStyle='#14213d';ctx.fillRect(P.x+4,P.y+51,10,5);ctx.fillRect(P.x+20,P.y+51,10,5)}let last=0;function loop(t){if(!S.run)return;if(t-last>16){physics();draw();last=t}requestAnimationFrame(loop)}
function key(e,on){let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))K.l=on;if(['arrowright','d'].includes(k))K.r=on;if(on&&['arrowup','w',' '].includes(k)){K.j=true;e.preventDefault()}}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));function hold(id,k){$(id).onpointerdown=e=>{e.preventDefault();K[k]=true};$(id).onpointerup=()=>K[k]=false;$(id).onpointercancel=()=>K[k]=false}hold('#left','l');hold('#right','r');$('#jump').onpointerdown=e=>{e.preventDefault();K.j=true};$('#start').onclick=()=>{wi=0;start()};$('#next').onclick=()=>{wi=wi===4?0:wi+1;start()};draw()})();</script></body></html>
